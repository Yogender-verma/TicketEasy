<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus Ticket Results | TicketEasy</title>
  <link rel="icon" href="logo.ico">
  <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body style="padding-bottom:60px;">

  <div class="route-header" id="routeTitle">
    Searching buses...
  </div>

  <div class="results-container" id="busContainer"></div>

  <script src="booking-modal.js?v=3.0"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    let from = params.get("from") || "Hyderabad";
    let to = params.get("to") || "Vijayawada";
    let date = params.get("date") || "Tomorrow";

    document.getElementById("routeTitle").innerHTML = `🚌 Buses : <b>${from} → ${to}</b> | Date : <b>${date}</b>`;

    const buses = [
      { name: "APSRTC Garuda Plus", type: "AC Sleeper", time: "05:30 AM", price: 799 },
      { name: "APSRTC Super Luxury", type: "Non AC Sleeper", time: "06:30 AM", price: 650 },
      { name: "VRL Travels", type: "Volvo AC Sleeper", time: "09:30 AM", price: 950 },
      { name: "Orange Travels", type: "AC Sleeper", time: "12:30 PM", price: 980 },
      { name: "SRS Volvo", type: "AC Sleeper", time: "02:30 PM", price: 1100 },
      { name: "Morning Star Travels", type: "AC Sleeper", time: "04:30 PM", price: 1050 },
      { name: "GreenLine Travels", type: "AC Multi-Axle", time: "11:30 PM", price: 950 }
    ];

    const container = document.getElementById("busContainer");

    buses.forEach(b => {
      const card = document.createElement("div");
      card.className = "result-card";
      card.innerHTML = `
        <div>
          <div class="bus-name">🚌 ${b.name}</div>
          <div class="result-details">
            Class: <b>${b.type}</b> • Departure: <b>${b.time}</b><br>
            Features: Free WiFi, Water Bottle, Charging Point, Live Tracking
          </div>
        </div>
        <div style="text-align:right;">
          <div class="price-tag">₹${b.price}</div>
          <button class="book-btn" onclick='triggerBooking("${b.name}", "${b.type}", ${b.price})'>Select Seats & Book</button>
        </div>`;
      container.appendChild(card);
    });

    function triggerBooking(busName, busType, price) {
      openBookingModal({
        title: busName,
        type: "bus",
        subtitle: `${busType} (${from} → ${to})`,
        route: `${from} → ${to}`,
        date: date,
        price: price
      });
    }
  </script>
</body>
</html>
