<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Search Results | TicketEasy</title>
  <link rel="icon" href="logo.ico">
  <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body style="padding-bottom: 60px;">

  <div class="route-header" id="routeHeader">
    Searching flights...
  </div>

  <div class="results-container">
    <h3 style="margin-bottom:16px; font-weight:800; font-size:20px;">Outbound Flights</h3>
    <div id="goingFlights"></div>

    <h3 style="margin-top:32px; margin-bottom:16px; font-weight:800; font-size:20px;">Return Flights</h3>
    <div id="returnFlights"></div>
  </div>

  <script src="booking-modal.js?v=3.0"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    let from = params.get("from") || "Hyderabad";
    let to = params.get("to") || "Dubai";
    let depart = params.get("depart") || "Tomorrow";
    let travellers = params.get("travellers") || "1 Adult, Economy";

    document.getElementById("routeHeader").innerHTML = `✈️ Route: <b>${from} → ${to}</b> | Departure: <b>${depart}</b> | Passengers: <b>${travellers}</b>`;

    const flights = [
      { name: "Emirates", number: "EK525", departure: "05:30 AM", arrival: "08:15 AM", price: 18500 },
      { name: "Air India", number: "AI951", departure: "09:45 AM", arrival: "12:30 PM", price: 16500 },
      { name: "IndiGo", number: "6E1403", departure: "02:30 PM", arrival: "05:20 PM", price: 15000 },
      { name: "SpiceJet", number: "SG107", departure: "08:00 PM", arrival: "10:45 PM", price: 14800 }
    ];

    function renderFlightList(list, containerId) {
      const container = document.getElementById(containerId);
      list.forEach(f => {
        const card = document.createElement("div");
        card.className = "result-card";
        card.innerHTML = `
          <div>
            <div class="flight-name">✈️ ${f.name} <span style="font-size:13px; color:var(--text-muted);">(${f.number})</span></div>
            <div class="result-details">
              Departs: <b>${f.departure}</b> • Arrives: <b>${f.arrival}</b><br>
              Inclusions: 25kg Check-in Baggage, Complimentary Meal, Power Outlet
            </div>
          </div>
          <div style="text-align:right;">
            <div class="price-tag">₹${f.price.toLocaleString('en-IN')}</div>
            <button class="book-btn" onclick='triggerFlightBooking("${f.name}", "${f.number}", ${f.price})'>Select Seat & Book</button>
          </div>`;
        container.appendChild(card);
      });
    }

    renderFlightList(flights, "goingFlights");
    renderFlightList(flights.map(f => ({...f, number: f.number + "-R", departure: "06:00 AM", arrival: "11:30 AM"})), "returnFlights");

    function triggerFlightBooking(name, number, price) {
      openBookingModal({
        title: `${name} (${number})`,
        type: "flight",
        subtitle: `${from} → ${to}`,
        route: `${from} → ${to}`,
        date: depart,
        price: price
      });
    }
  </script>
</body>
</html>
