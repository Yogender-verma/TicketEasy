<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>

body {
margin: 0;
background-image: linear-gradient(
to bottom,
#f5fffa,
#00F7FF);
background-attachment: fixed;
background-size: cover;
overflow: hidden;
display: flex;
flex-direction: column;
height: 100vh; 
}

.head {
background-color: skyblue;
color: white;
text-align: center;
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 20px;
border-bottom: 2px solid black;
}

.logo h1 {
margin: 0;
}

/* Login Container */

.container{
width:400px;
background:white;
margin:auto;
padding:25px;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,0.3);
text-align:center;
}

.container input{
width:90%;
padding:10px;
margin:10px 0;
border-radius:6px;
border:1px solid gray;
}

.container button{
padding:10px 20px;
background:#00bfff;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

</head>

<body>


<div class="container">

<h2>Login</h2>

<input type="text" id="user" placeholder="Enter Email or Phone">

<input type="password" id="password" placeholder="Enter Password">

<br>

<button onclick="login()">Login</button>

<p id="result"></p>

</div>


<script>

var firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "yourproject.firebaseapp.com",
databaseURL: "https://yourproject-default-rtdb.firebaseio.com",
projectId: "yourproject",
storageBucket: "yourproject.appspot.com",
messagingSenderId: "123456",
appId: "123456"
};

firebase.initializeApp(firebaseConfig);

var db = firebase.database();


function login(){

var user=document.getElementById("user").value;
var password=document.getElementById("password").value;

db.ref("users").once("value",function(snapshot){

var found=false;

snapshot.forEach(function(child){

var data=child.val();

if((data.email==user || data.phone==user) && data.password==password){

found=true;

}

});

if(found){

window.location.href="profile1.html";

}
else{

document.getElementById("result").innerText="Invalid login details";

}

});

}

</script>

</body>
</html>
