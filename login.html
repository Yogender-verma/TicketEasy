<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | TicketEasy</title>
  <link rel="icon" href="logo.ico">
  <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px;">

  <div class="glass-card" style="width:420px; text-align:center; padding:40px;">
    <div style="font-size:36px; margin-bottom:10px;">👤</div>
    <h2 style="font-size:26px; font-weight:800; margin-bottom:6px; color:white;">Welcome Back</h2>
    <p style="color:var(--text-muted); font-size:13px; margin-bottom:24px;">Login to manage your bookings and AI travel copilot</p>

    <div style="text-align:left; margin-bottom:14px;">
      <label>Email or Phone Number</label>
      <input type="text" id="user" placeholder="Enter your email or phone" value="user@ticketeasy.com">
    </div>

    <div style="text-align:left; margin-bottom:20px;">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" value="••••••••">
    </div>

    <button class="search-btn" style="margin-bottom:14px;" onclick="handleLogin()">🔒 SECURE LOGIN</button>
    <button class="action-btn" style="background:rgba(255,255,255,0.08); font-size:13px;" onclick="fillDemoAndLogin()">⚡ Demo Quick Login</button>

    <p style="margin-top:20px; font-size:13px; color:var(--text-muted);">
      Don't have an account? <a href="signup.html" style="color:var(--primary); font-weight:700;">Sign Up</a>
    </p>
  </div>

  <script src="booking-modal.js?v=3.0"></script>
  <script>
    function handleLogin() {
      const user = document.getElementById("user").value.trim();
      if (!user) { alert("Please enter your email or phone number."); return; }
      localStorage.setItem("ticketEasyUser", JSON.stringify({ email: user, phone: "+91 98421 77210", name: "Yogendar Verma" }));
      window.location.href = "Profile.html";
    }

    function fillDemoAndLogin() {
      document.getElementById("user").value = "yogendar@ticketeasy.com";
      handleLogin();
    }
  </script>
</body>
</html>
