<!DOCTYPE html>
<html>
<head>
<title>MT | My Tickets</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(to bottom,#f5fffa,#00F7FF);
}

/* HEADER */

.header{
    background:skyblue;
    color:white;
    text-align:center;
    padding:20px;
    font-size:28px;
}

/* TICKET SECTION */

.container{
    width:85%;
    margin:auto;
    margin-top:40px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
}

/* TICKET CARD */

.ticket{
    width:260px;
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 6px 15px rgba(0,0,0,0.2);
    transition:0.3s;
}

.ticket:hover{
    transform:translateY(-6px);
}

.ticket h3{
    color:#FF4400;
    margin-bottom:10px;
}

.ticket p{
    font-size:14px;
    margin:5px 0;
}

/* BUTTON */

.ticket button{
    margin-top:10px;
    padding:8px 14px;
    border:none;
    border-radius:6px;
    background:#FF4400;
    color:white;
    cursor:pointer;
}

.ticket button:hover{
    background:#00F7FF;
}

/* EMPTY MESSAGE */

.empty{
    text-align:center;
    margin-top:80px;
    font-size:22px;
}

</style>
</head>

<body>

<div class="header"> My Booked Tickets
</div>

<div class="container" id="ticketContainer">

</div>

<div class="empty" id="emptyMessage">
No Tickets Booked Yet
</div>


<script>

/* Get tickets from localStorage */

let tickets = JSON.parse(localStorage.getItem("tickets")) || [];


/* Display tickets */

function showTickets(){

let container = document.getElementById("ticketContainer");
let empty = document.getElementById("emptyMessage");

container.innerHTML="";

if(tickets.length === 0){
empty.style.display="block";
return;
}

empty.style.display="none";

tickets.forEach((t,index)=>{

container.innerHTML += `

<div class="ticket">

<h3>${t.name}</h3>

<p><b>Route:</b> ${t.route}</p>

<p><b>Price:</b> ₹${t.price}</p>

<p><b>Date:</b> ${t.date}</p>

<button onclick="cancelTicket(${index})">
Cancel Ticket
</button>

</div>

`;

});

}


/* Cancel ticket */

function cancelTicket(index){

tickets.splice(index,1);

localStorage.setItem("tickets",JSON.stringify(tickets));

showTickets();

}


/* Load tickets when page opens */

showTickets();

</script>

</body>
</html>
