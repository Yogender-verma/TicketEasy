<!DOCTYPE html>
<html>
<head>
<title>Profile</title>

<style>

body {
margin: 0;
background-image: linear-gradient(
to bottom,
#f5fffa,
#00F7FF);
background-attachment: fixed;
background-size: cover;
overflow: hidden;
display: flex;
flex-direction: column;
height: 100vh; 
}

.head {
background-color: skyblue;
color: white;
text-align: center;
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 20px;
border-bottom: 2px solid black;
}

.logo h1 {
margin: 0;
}

/* Profile Container */

.container{
width:450px;
background:white;
margin:auto;
padding:20px;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,0.3);
text-align:center;
}

.section{
margin-bottom:20px;
}

.ticket{
background:#e6faff;
padding:8px;
margin-top:8px;
border-radius:5px;
}

.logout{
margin-top:20px;
text-align:center;
}

.logout button{
padding:10px 20px;
border:none;
background:red;
color:white;
border-radius:6px;
cursor:pointer;
}

</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

</head>

<body>

<div class="head">
<div class="logo">
<h1>TicketEasy</h1>
</div>
</div>


<div class="container">

<h2>My Profile</h2>

<div class="section">
<h3>Basic Details</h3>

<p><b>Phone:</b> <span id="phone"></span></p>
<p><b>Email:</b> <span id="email"></span></p>

</div>


<div class="section">

<h3>Recent Tickets</h3>

<div id="tickets"></div>

</div>


<div class="logout">
<button onclick="logout()">Logout</button>
</div>

</div>


<script>

var firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "yourproject.firebaseapp.com",
databaseURL: "https://yourproject-default-rtdb.firebaseio.com",
projectId: "yourproject",
storageBucket: "yourproject.appspot.com",
messagingSenderId: "123456",
appId: "123456"
};

firebase.initializeApp(firebaseConfig);

var db=firebase.database();


/* LOAD USER DETAILS */

db.ref("users").limitToLast(1).once("value",function(snapshot){

snapshot.forEach(function(child){

var data=child.val();

document.getElementById("phone").innerText=data.phone;
document.getElementById("email").innerText=data.email;

});

});


/* LOAD RECENT TICKETS */

db.ref("tickets").limitToLast(5).once("value",function(snapshot){

var ticketContainer=document.getElementById("tickets");

snapshot.forEach(function(child){

var ticket=child.val();

ticketContainer.innerHTML +=
"<div class='ticket'>"+
"<b>Bus:</b> "+ticket.bus+"<br>"+
"<b>Seat:</b> "+ticket.seat+"<br>"+
"<b>Date:</b> "+ticket.date+
"</div>";

});

});


function logout(){

window.location.href="login.html";

}

</script>

</body>
</html>
