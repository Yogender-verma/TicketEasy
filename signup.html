<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketEasy | Sign Up</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-box">
      <h3>Sign Up</h3>
      <label>Phone No:</label>
      <input type="number" id="number" placeholder="Phone number"><br>
      <label>Email ID:</label>
      <input type="email" id="Email" placeholder="Email address"><br>
      <label>Password:</label>
      <input type="password" id="password" placeholder="Create password" onkeyup="checkStrength()">
      <div id="strength"></div><br>
      <button onclick="signup()">SIGN UP</button>
      <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "yourproject.firebaseapp.com",
      databaseURL: "https://yourproject-default-rtdb.firebaseio.com",
      projectId: "yourproject",
      storageBucket: "yourproject.appspot.com",
      messagingSenderId: "123456",
      appId: "123456"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
  <script src="scripts.js"></script>
</body>
</html>
