<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Train Search Results | TicketEasy</title>
  <link rel="icon" href="logo.ico">
  <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body style="padding-bottom: 60px;">

  <div class="route-header" id="routeHeader">
    Searching trains...
  </div>

  <div class="results-container">
    <h3 style="margin-bottom:16px; font-weight:800; font-size:20px;">Available Trains</h3>
    <div id="goingTrains"></div>

    <h3 style="margin-top:32px; margin-bottom:16px; font-weight:800; font-size:20px;">Return Trains</h3>
    <div id="returnTrains"></div>
  </div>

  <script src="booking-modal.js?v=3.0"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    let from = params.get("from") || "Secunderabad (SC)";
    let to = params.get("to") || "Vijayawada (BZA)";
    let date = params.get("date") || "Tomorrow";
    let trainClass = params.get("class") || "All Classes";
    let quota = params.get("quota") || "General";

    document.getElementById("routeHeader").innerHTML = `🚆 Route: <b>${from} → ${to}</b> | Date: <b>${date}</b> | Class: <b>${trainClass}</b> | Quota: <b>${quota}</b>`;

    const trains = [
      { name: "Krishna Express", number: "17405", departure: "06:00 AM", arrival: "11:30 AM", price: 350 },
      { name: "Godavari Express", number: "12727", departure: "07:45 AM", arrival: "12:40 PM", price: 450 },
      { name: "Satavahana Express", number: "12713", departure: "09:30 AM", arrival: "02:45 PM", price: 380 },
      { name: "Falaknuma Express", number: "12703", departure: "12:15 PM", arrival: "05:20 PM", price: 520 }
    ];

    function renderTrainList(list, containerId) {
      const container = document.getElementById(containerId);
      list.forEach(t => {
        const card = document.createElement("div");
        card.className = "result-card";
        card.innerHTML = `
          <div>
            <div class="train-name">🚆 ${t.name} <span style="font-size:13px; color:var(--text-muted);">(${t.number})</span></div>
            <div class="result-details">
              Departs: <b>${t.departure}</b> • Arrives: <b>${t.arrival}</b><br>
              Quota: <span style="color:var(--primary); font-weight:700;">${quota}</span> • Class: <b>${trainClass}</b>
            </div>
          </div>
          <div style="text-align:right;">
            <div class="price-tag">₹${t.price}</div>
            <button class="book-btn" onclick='triggerTrainBooking("${t.name}", "${t.number}", ${t.price})'>Book Berth</button>
          </div>`;
        container.appendChild(card);
      });
    }

    renderTrainList(trains, "goingTrains");
    renderTrainList(trains.map(t => ({...t, number: parseInt(t.number)+1+"", departure: "05:30 AM", arrival: "11:00 AM"})), "returnTrains");

    function triggerTrainBooking(name, number, price) {
      openBookingModal({
        title: `${name} (${number})`,
        type: "train",
        subtitle: `${from} → ${to} (${quota})`,
        route: `${from} → ${to}`,
        date: date,
        price: price
      });
    }
  </script>
</body>
</html>
